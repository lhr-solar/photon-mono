services:
  photon-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: photon-server:latest
    container_name: photon-server
    restart: unless-stopped
    ports:
      # Ingress (CANP stream ingestion)
      - "6100:6100"
      # Fan-out (downstream clients)
      - "6500:6500"
      # Observer (JSON telemetry / TUI monitor)
      - "5400:5400"
      # Video ingress (RTP/H.264)
      - "6200:6200/udp"
      # Video live/replay clients
      - "6700:6700"
    # Native server ports (comments only; not live mappings):
    #   6200/udp+tcp  video ingress
    #   6201/udp      RTCP
    #   6800/udp      live NAL fan-out
    #   8080          local UI
    #   5400          observer
    environment:
      - PHOTON_HOST=0.0.0.0
      - PHOTON_INGRESS_PORT=6100
      - PHOTON_CLIENT_PORT=6500
      - PHOTON_OBSERVER_PORT=5400
      - PHOTON_VIDEO_INGRESS_PORT=6200
      - PHOTON_VIDEO_CLIENT_PORT=6700
      - PHOTON_DATA_DIR=/data
    volumes:
      # Persistent storage for segments
      - photon-data:/data

volumes:
  photon-data:
    driver: local
