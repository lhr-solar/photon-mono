[project]
name = "photon-gamma"
version = "0.1.0"
description = "MCP server for Photon telemetry in InfluxDB 3, behind Google sign-in"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp==4.1.0",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
